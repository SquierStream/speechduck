name: 🐞 Bug report
description: Something isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! The more detail you give, the faster we can fix it.

  - type: input
    id: version
    attributes:
      label: SpeechDuck version
      description: Found in Stream Deck's plugin details, or the plugin's settings panel.
      placeholder: "e.g. 1.12.1.0"
    validations:
      required: true

  - type: input
    id: streamdeck-version
    attributes:
      label: Stream Deck app version
      placeholder: "e.g. 6.9.1"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: triggers-targets
    attributes:
      label: Your Triggers / Targets setup
      description: A screenshot of the settings panel, or a description of what's configured, helps a lot.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log file (if possible)
      description: |
        Drag and drop the plugin's log file here if you have one (found via Stream Deck's
        "Log file" option in the plugin's action context menu).
    validations:
      required: false
